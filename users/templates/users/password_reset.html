<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Your Password</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .container {
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 20px;
            margin-top: 20px;
        }
        h1 {
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="password"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .error {
            color: red;
            margin-top: 10px;
        }
        .success {
            color: green;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Reset Your Password</h1>
        <p>Enter your new password below.</p>
        
        <div id="message"></div>
        
        <form id="resetForm">
            <div class="form-group">
                <label for="password1">New Password</label>
                <input type="password" id="password1" name="password1" required>
            </div>
            <div class="form-group">
                <label for="password2">Confirm New Password</label>
                <input type="password" id="password2" name="password2" required>
            </div>
            <button type="submit">Reset Password</button>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const resetForm = document.getElementById('resetForm');
            const messageDiv = document.getElementById('message');
            
            resetForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const password1 = document.getElementById('password1').value;
                const password2 = document.getElementById('password2').value;
                
                // Check if passwords match
                if (password1 !== password2) {
                    messageDiv.innerHTML = '<p class="error">Passwords do not match!</p>';
                    return;
                }
                
                // Get the UID and token from the URL
                const pathParts = window.location.pathname.split('/');
                const uid = pathParts[pathParts.length - 3];
                const token = pathParts[pathParts.length - 2];
                
                // Send the reset request
                fetch('/api/users/password-reset-confirm/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        uid: uid,
                        token: token,
                        new_password1: password1,
                        new_password2: password2
                    })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        messageDiv.innerHTML = '<p class="success">' + data.success + '</p>';
                        resetForm.reset();
                        // Redirect to login page after 3 seconds
                        setTimeout(() => {
                            window.location.href = '/api/users/login/';
                        }, 3000);
                    } else if (data.error) {
                        messageDiv.innerHTML = '<p class="error">' + data.error + '</p>';
                    }
                })
                .catch(error => {
                    messageDiv.innerHTML = '<p class="error">An error occurred. Please try again.</p>';
                    console.error('Error:', error);
                });
            });
        });
    </script>
</body>
</html>
